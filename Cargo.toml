[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/TW0hank0/positive_toolbox"
description = "面向使用者的工具"
license = "AGPL-3.0-only"
authors = ["TW0hank0 <public.email.hank@gmail.com>"]
rust-version = "1.94"

[workspace.dependencies]
positive_toolbox = { path = "." }
ptb_shared = { path = "ptb_shared" }
ptb_tools = { path = "ptb_tools" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
image = "0.25.9"
log = "0.4.28"
time = { version = "0.3.47", features = ["local-offset", "formatting"] }
time-macros = { version = "0.2.27" }
quick-xml = { version = "0.39.0", features = ["serialize"] }
sysinfo = "0.38.1"
iced = { version = "0.14.0", features = [
    "x11",
    "thread-pool",
    "linux-theme-detection",
    "wayland",
    "debug",
    "advanced",
    "image",
    "wgpu",
    "tiny-skia",
    "webgl",
]}
# --- platform: desktop ---
open = { version = "5.3.3" }
clap = { version = "4.6.1", features = ["derive", "color"] }
positive_tool_rs = { git = "https://github.com/TW0hank0/positive_tool_rs", rev = "608ac296" }
# --- platform: wasm ---
console_error_panic_hook = "0.1.7"
console_log = { version = "1.0.0", features = ["wasm-bindgen"] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
wasm-bindgen = "0.2.121"


[workspace]
resolver = "3"
members = ["ptb_main", "ptb_shared", "ptb_tools"]

[profile.release]
opt-level = 3
lto = true
debug = 0

[profile.dev]
debug = 2
lto = false
