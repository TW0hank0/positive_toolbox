[package]
name = "ptb_tools"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
iced = { workspace = true }
quick-xml = { workspace = true }
sysinfo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ptb_shared = { workspace = true }
log = { workspace = true }
open = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
iced = { version = "0.14.0", default-features = false, features = [
    "thread-pool",
    "advanced",
    "webgl",
    "wgpu",
    "web-colors",
    "crisp",
    "image",
] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
console_log = { version = "1.0.0", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2.108"

[[bin]]
name = "code_indenter"
path = "src/code_indenter.rs"

[[bin]]
name = "system_info"
path = "src/system_info.rs"

[[bin]]
name = "about"
path = "src/about/about_main.rs"

[[bin]]
name = "about_show_full_license"
path = "src/about/about_show_full_license.rs"

[[bin]]
name = "eazy_updater"
path = "src/eazy_updater.rs"

[build-dependencies]
cargo_metadata = "0.19"
serde = { version = "1.0", features = ["derive"] }
heck = "0.5"
